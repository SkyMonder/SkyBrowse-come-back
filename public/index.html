<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyBrowse – Быстрый и безопасный поиск</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            width: 100%;
            max-width: 700px;
        }
        .logo {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 2.5rem;
            font-size: 1.2rem;
        }
        .search-box {
            display: flex;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(255,255,255,0.15);
            transition: border-color 0.3s;
            margin-bottom: 2rem;
        }
        .search-box:focus-within {
            border-color: #38bdf8;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 1rem;
            font-size: 1.1rem;
            color: white;
            outline: none;
        }
        .search-box input::placeholder {
            color: #64748b;
        }
        .search-box button {
            background: #38bdf8;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.3s;
            color: #0f172a;
            font-size: 1.3rem;
            font-weight: bold;
            flex-shrink: 0;
        }
        .search-box button:hover {
            background: #0ea5e9;
        }
        .results {
            text-align: left;
        }
        .result-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 1.2rem;
            margin-bottom: 0.75rem;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .result-item:hover {
            background: rgba(255,255,255,0.1);
        }
        .result-item h3 {
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
        }
        .result-item h3 a {
            color: #38bdf8;
            text-decoration: none;
        }
        .result-item h3 a:hover {
            text-decoration: underline;
        }
        .result-link {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }
        .result-snippet {
            color: #cbd5e1;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .status {
            margin-top: 1rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        .footer {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: #475569;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SkyBrowse</div>
        <div class="subtitle">Приватный поиск без отслеживания</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Введите запрос..." autofocus>
            <button id="searchBtn">→</button>
        </div>
        <div class="results" id="results"></div>
        <div class="status" id="status"></div>
    </div>
    <div class="footer">Защищено SkyBrowse VPN · Никаких трекеров</div>

    <script>
        const input = document.getElementById('searchInput');
        const button = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');
        const statusDiv = document.getElementById('status');

        async function performSearch() {
            const query = input.value.trim();
            if (!query) return;

            statusDiv.textContent = 'Поиск...';
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    displayResults(data.results);
                } else {
                    resultsDiv.innerHTML = '<div class="empty">Ничего не найдено. Попробуйте другой запрос.</div>';
                }
            } catch (err) {
                resultsDiv.innerHTML = '<div class="empty">Ошибка соединения. Попробуйте позже.</div>';
                console.error(err);
            }
            statusDiv.textContent = '';
        }

        function displayResults(results) {
            let html = '';
            results.forEach(r => {
                html += `
                    <div class="result-item">
                        <h3><a href="${escapeHTML(r.link)}" target="_blank">${escapeHTML(r.title)}</a></h3>
                        <div class="result-link">${escapeHTML(r.link)}</div>
                        <div class="result-snippet">${escapeHTML(r.snippet || '')}</div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        button.addEventListener('click', performSearch);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Поддержка быстрого поиска из адресной строки браузера (если передано ?q=...)
        const urlParams = new URLSearchParams(window.location.search);
        const initialQuery = urlParams.get('q');
        if (initialQuery) {
            input.value = initialQuery;
            performSearch();
        }
    </script>
</body>
</html>
